name = "witipedia"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

[vars]
SITE_NAME = "Witipedia"
SITE_TAGLINE = "It's funny because it's true."
# Anyone can edit without an account, exactly like Wikipedia. Set to "false"
# only if you are under sustained vandalism.
ANON_EDITING = "true"

[[d1_databases]]
binding = "DB"
database_name = "witipedia"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Uploaded images. setup.sh enables whichever of these your account supports:
# R2 first, and a KV namespace as a fallback when R2 is not available. With
# neither, the wiki runs normally and uploads are switched off.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "witipedia-media"

# [[kv_namespaces]]
# binding = "MEDIA_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Your own domain. setup.sh adds this for you, or uncomment it and set the
# domain yourself. The domain must already be in the same Cloudflare account.
# [[routes]]
# pattern = "witipedia.co"
# custom_domain = true
