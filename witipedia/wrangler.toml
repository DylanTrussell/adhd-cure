name = "witipedia"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

[vars]
SITE_NAME = "Witipedia"
SITE_TAGLINE = "It's funny because it's true."
# Anyone can edit without an account, exactly like Wikipedia. Set to "false"
# only if you are under sustained vandalism.
ANON_EDITING = "true"

[[d1_databases]]
binding = "DB"
database_name = "witipedia"
database_id = "678738c0-6896-41c6-8457-0e1c8ac9f2e2"

# Uploaded images. R2 is the store uploads use. MEDIA_KV is the fallback
# storage.js uses only when MEDIA is not bound.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "witipedia-media"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "b7f4a68b79d2415c85b65f51873f8e6f"

# Already attached to the live worker. Keep it here so a deploy does not drop it.
[[routes]]
pattern = "witipedia.co"
custom_domain = true
